   </g>
   <g id="text_27">
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(48.305425 393.728437)">control (36.3-&gt;33.5%) and meancenter (34.2-&gt;29.9%) INVERT: the probe FALLS as the SSL objective</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(48.305425 404.847316)">trains, and mean-centering DEEPENS the drop (F1 refuted as a sufficient cause). Levers that reverse</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(48.305425 415.966194)">the drift direction: self-prediction (cell-3, 29.5-&gt;31.8%) erases it; early-stopping the settle</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(48.305425 427.425822)">(t15, 39.5-&gt;42.5%) erases it AND clears control by +9pp. Same 5k/1k probe budget for every cell; the</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(48.305425 438.5447)">~62.5% original (different budget) is not comparable and is not plotted.</text>
   </g>
