   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; text-anchor: middle; fill: #232936" x="146.7324" y="150.424035" transform="rotate(-0 146.7324 150.424035)">All-positive patch</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(101.108406 208.623833)">no mean subtraction:</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(110.841422 217.611225)">every pixel &gt;= 0</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Calibri'; text-anchor: middle; fill: #ffffff" x="273.9168" y="130.99506" transform="rotate(-0 273.9168 130.99506)">2</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(305.198206 145.311051)">Shared DC across</text>
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(306.82448 155.537019)">nested windows</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(297.005666 204.128215)">6 streams are nested</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(293.247119 213.115608)">views of one fixation -&gt;</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(285.22265 222.103)">large common positive level</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Calibri'; text-anchor: middle; fill: #ffffff" x="469.0152" y="130.99506" transform="rotate(-0 469.0152 130.99506)">3</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(495.102348 145.311051)">NWTA winners lock</text>
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(490.17927 155.537019)">to the common-mode</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(491.009878 204.126293)">top-15 units track the</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(484.786847 213.113686)">high-variance DC, not the</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(483.261519 222.104922)">low-variance digit residual</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Calibri'; text-anchor: middle; fill: #ffffff" x="664.1136" y="130.99506" transform="rotate(-0 664.1136 130.99506)">4</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(697.063928 145.311051)">Cross-prediction</text>
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(689.804037 155.537019)">minimises FE via DC</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(680.894231 204.08824)">predicting the shared DC</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(681.903856 213.117529)">is the trivial, fastest way</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(687.477294 222.142975)">to shrink free energy</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Calibri'; text-anchor: middle; fill: #ffffff" x="859.212" y="130.99506" transform="rotate(-0 859.212 130.99506)">5</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(898.882273 145.305418)">Digit residual</text>
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #232936" transform="translate(898.474297 155.542652)">squeezed out</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(874.5051 204.128215)">W,R rotate to reconstruct</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(878.831241 213.115608)">the DC -&gt; digit contrast</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(878.719131 222.106843)">leaves the winner code</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Calibri'; text-anchor: middle; fill: #ffffff" x="1054.3104" y="130.99506" transform="rotate(-0 1054.3104 130.99506)">6</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #cc3311" transform="translate(1090.618689 145.244422)">Probe FALLS as</text>
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'Calibri'; fill: #cc3311" transform="translate(1078.921752 155.603647)">FE FALLS  (inversion)</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(1078.078328 204.128215)">dense settled z loses</text>
    <text style="font-size: 8.2px; font-family: 'Calibri'; fill: #5b6b7c" transform="translate(1069.372234 213.115608)">digit content: 43.0 -&gt; 37.9</text>
