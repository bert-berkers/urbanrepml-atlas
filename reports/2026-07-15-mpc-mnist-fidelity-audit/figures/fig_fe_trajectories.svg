   <g id="text_20">
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #232936" transform="translate(52.872456 418.037341)">Free energy fell ~20% (599.5 -&gt; 477.2) vs ~2% for control (610.8 -&gt; 596.2) -- yet the digit probe</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #232936" transform="translate(52.872456 429.156219)">got WORSE (see probe-drift). Lower free energy is NOT more digit content: the SSL descent found a</text>
    <text style="font-size: 9.4px; font-family: 'Calibri'; fill: #232936" transform="translate(52.872456 440.102592)">cheaper, less digit-legible code.</text>
   </g>
  </g>
  <g id="text_21">
   <text style="font-style: italic; font-size: 8.6px; font-family: 'Calibri'; text-anchor: start; fill: #5b6b7c" x="41.467656" y="13.158187" transform="rotate(-0 41.467656 13.158187)">free energy = prediction-error energy summed over streams x layers, mean over the epoch (lower = better SSL fit, NOT better digit readout)</text>
  </g>
